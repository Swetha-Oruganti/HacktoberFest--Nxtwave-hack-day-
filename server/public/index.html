<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101012"><meta name="description" content="Practice interview questions by company. Learn from real candidate experiences and build confidence with focused coding practice.">
  <script>try{const saved=localStorage.getItem("interviewiq_theme");document.documentElement.dataset.theme=saved==="light"||saved==="dark"?saved:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch{document.documentElement.dataset.theme="dark"}</script>
  <title>InterviewIQ — prepare with intent</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/theme.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home"><span class="brand-glyph">i<span>q</span></span><span class="brand-name">interview<span>IQ</span></span></a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>Overview <span class="nav-shortcut">⌘ 1</span></button>
        <button class="nav-item" data-view="questions"><span class="nav-icon">◈</span>Question bank</button>
        <button class="nav-item" data-view="experiences"><span class="nav-icon">▤</span>Experiences</button>
      </nav>
      <div class="sidebar-rule"></div><div class="workspace-label company-label">YOUR TARGETS <button class="text-button" id="add-target">+</button></div>
      <div class="target-list" id="target-list"></div>
      <div class="sidebar-bottom"><div class="pro-card"><div class="pro-spark">✳</div><strong>Show what you know.</strong><p>Every question is a chance to build your edge.</p><button class="pro-link" data-view="questions">Find your next question <span>↗</span></button></div>
        <button class="profile-button" id="profile-button"><span class="avatar" id="avatar">G</span><span class="profile-meta"><b id="profile-name">Guest learner</b><small id="profile-plan">Free workspace</small></span><span class="profile-menu">···</span></button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="breadcrumbs"><span>Workspace</span><span class="crumb-slash">/</span><b id="crumb">Overview</b></div><div class="top-actions"><span class="today-label" id="today-label"></span><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode" aria-pressed="false"><span class="theme-icon" aria-hidden="true">☼</span><span class="theme-label">Light mode</span></button><button class="icon-button" id="help-button" aria-label="Help">?</button><button class="small-avatar" id="top-avatar">G</button></div></header>
      <div id="page-content" class="page-content"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div><div id="modal-root"></div>
  <script src="/app.js"></script>
</body></html>
